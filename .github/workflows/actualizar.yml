name: Actualizar datos

on:
  schedule:
    - cron: "30 5 * * *"      # cada día, 07:30 en Madrid (horario de verano); el RTA se actualiza de madrugada
  workflow_dispatch:           # ejecución manual desde la pestaña Actions

permissions:
  contents: write

concurrency: actualizar

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyproj

      - name: Comprobar acceso a las fuentes
        run: |
          curl -s -m 60 -o /dev/null -w "Junta lastUpdate: %{http_code} %{time_total}s
" "https://datos.juntadeandalucia.es/api/v0/openrta/search/lastUpdateData" || echo "Junta: sin respuesta"
          curl -s -m 120 -o /dev/null -w "Junta busqueda (3): %{http_code} %{time_total}s
" "https://datos.juntadeandalucia.es/api/v0/openrta/search?id=-&object_type=Vivienda%20de%20uso%20tur%C3%ADstico&category=-&group=-&modality=-&province=-&municipality=MARBELLA&order_by=id&format=json&size=3&mode=ASC" || echo "Junta busqueda: sin respuesta"
          curl -s -m 60 -o /dev/null -w "Catastro: %{http_code} %{time_total}s
" "https://ovc.catastro.meh.es/ovcservweb/OVCSWLocalizacionRC/OVCCallejero.asmx/Consulta_DNPRC?Provincia=&Municipio=&RC=9100101UF3490S" || echo "Catastro: sin respuesta"

      - name: Registro de Turismo de Andalucía (RTA)
        run: python -u generar_mapa.py

      - name: Catastro (solo parcelas nuevas o pendientes)
        run: python generar_edificios.py

      - name: Publicar si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898888+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualización automática $(date -u +%F)"
          git push
