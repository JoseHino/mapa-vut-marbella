name: Diagnostico fuentes

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Junta por tamaños y Catastro
        run: |
          J="https://datos.juntadeandalucia.es/api/v0/openrta/search"
          Q="id=-&object_type=Vivienda%20de%20uso%20tur%C3%ADstico&category=-&group=-&modality=-&province=-&municipality=MARBELLA&order_by=id&format=json&mode=ASC"
          for n in 500 2000 4000 8000; do
            echo "Junta size=$n: $(curl -s -m 600 -o /dev/null -w '%{http_code} %{size_download}B %{time_total}s' "$J?$Q&size=$n")"
          done
          echo "Catastro con UA: $(curl -s -m 60 -A 'Mozilla/5.0' -o /dev/null -w '%{http_code} %{time_total}s' 'https://ovc.catastro.meh.es/ovcservweb/OVCSWLocalizacionRC/OVCCallejero.asmx/Consulta_DNPRC?Provincia=&Municipio=&RC=9100101UF3490S')"
          echo "Catastro INSPIRE: $(curl -s -m 60 -A 'Mozilla/5.0' -o /dev/null -w '%{http_code} %{time_total}s' 'https://ovc.catastro.meh.es/INSPIRE/wfsBU.aspx?service=wfs&version=2&request=getfeature&STOREDQUERIE_ID=GetBuildingPartByParcel&refcat=9100101UF3490S&srsname=EPSG::25830')"
